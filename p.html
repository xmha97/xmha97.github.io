<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
      font-family: sans-serif;
      user-select: none;
    }

    #container {
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
    }

    #weekday {
      font-size: 0.5em;
      font-weight: 400;
    }

    #date {
      font-size: 1em;
      font-weight: 500;
    }

    #difference {
      font-size: 0.35em;
      font-weight: 400;
    }

    #container.changed {
      color: red;
    }
  </style>
</head>

<body>
  <div id="container">
    <div id="weekday"></div>
    <div id="date"></div>
    <div id="difference"></div>
  </div>

  <script>
    const container = document.getElementById("container");
    const weekday = document.getElementById("weekday");
    const date = document.getElementById("date");
    const difference = document.getElementById("difference");

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    let selectedDate = new Date(today);
    let resetTimer;

    function updateFontSize() {
      let size = Math.min(window.innerWidth, window.innerHeight);

      container.style.fontSize = `${size}px`;

      while (
        (container.scrollWidth > window.innerWidth ||
         container.scrollHeight > window.innerHeight) &&
        size > 1
      ) {
        size -= 1;
        container.style.fontSize = `${size}px`;
      }
    }

    function updateDate() {
      const formatter = new Intl.DateTimeFormat(
        "en-US-u-ca-persian",
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

      const parts = formatter.formatToParts(selectedDate);

      const day = parts.find(p => p.type === "day").value;
      const month = parts.find(p => p.type === "month").value;
      const year = parts.find(p => p.type === "year").value;

      date.textContent = `${month} ${day}, ${year}`;

      weekday.textContent = new Intl.DateTimeFormat("en-US", {
        weekday: "long"
      }).format(selectedDate);

      const days =
        Math.round(
          (selectedDate - today) / (1000 * 60 * 60 * 24)
        );

      if (days === 0) {
        difference.textContent = "Today";
      } else if (days === 1) {
        difference.textContent = "1 day from now";
      } else if (days > 1) {
        difference.textContent = `${days} days from now`;
      } else if (days === -1) {
        difference.textContent = "1 day ago";
      } else {
        difference.textContent = `${Math.abs(days)} days ago`;
      }

      container.classList.toggle("changed", days !== 0);

      updateFontSize();
    }

    function resetToToday() {
      selectedDate = new Date(today);
      updateDate();
    }

    function resetInactivityTimer() {
      clearTimeout(resetTimer);

      resetTimer = setTimeout(() => {
        resetToToday();
      }, 10000);
    }

    document.addEventListener("keydown", event => {
      resetInactivityTimer();

      switch (event.key) {
        case "ArrowLeft":
          selectedDate.setDate(selectedDate.getDate() - 1);
          break;

        case "ArrowRight":
          selectedDate.setDate(selectedDate.getDate() + 1);
          break;

        case "ArrowUp":
        case "PageUp":
          selectedDate.setMonth(selectedDate.getMonth() + 1);
          break;

        case "ArrowDown":
        case "PageDown":
          selectedDate.setMonth(selectedDate.getMonth() - 1);
          break;

        case "Backspace":
        case "Enter":
        case " ":
        case "Escape":
          resetToToday();
          event.preventDefault();
          return;

        default:
          return;
      }

      event.preventDefault();
      updateDate();
    });

    window.addEventListener("resize", updateFontSize);

    updateDate();
    resetInactivityTimer();
  </script>
</body>
</html>
