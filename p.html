<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font: 24px sans-serif;
      background: Canvas;
      color: CanvasText;
    }
  </style>
</head>

<body>
  <div id="date"></div>

  <script>
    const d = new Date();

    date.textContent = new Intl.DateTimeFormat("en-US-u-ca-persian", {
      dateStyle: "long"
    }).format(d);
  </script>
</body>
</html>
