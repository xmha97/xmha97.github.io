<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5vh 5vw;
      box-sizing: border-box;
      background: Canvas;
      color: CanvasText;
      font-family: sans-serif;
      user-select: none;
    }

    #weekday {
      font-size: min(5vw, 8vh);
      font-weight: 400;
      text-align: center;
    }

    #date {
      font-size: min(12vw, 20vh);
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    #difference {
      font-size: min(4vw, 6vh);
      font-weight: 400;
      text-align: center;
    }

    #date.changed,
    #weekday.changed,
    #difference.changed {
      color: red;
    }
  </style>
</head>

<body>
  <div id="weekday"></div>
  <div id="date"></div>
  <div id="difference"></div>

  <script>
    const weekday = document.getElementById("weekday");
    const date = document.getElementById("date");
    const difference = document.getElementById("difference");

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    let selectedDate = new Date(today);
    let resetTimer;

    function updateDate() {
      const parts = new Intl.DateTimeFormat("en-US-u-ca-persian", {
        day: "numeric",
        month: "long",
        year: "numeric"
      }).formatToParts(selectedDate);

      const day = parts.find(p => p.type === "day").value;
      const month = parts.find(p => p.type === "month").value;
      const year = parts.find(p => p.type === "year").value;

      date.textContent = `${month} ${day}, ${year}`;

      weekday.textContent = new Intl.DateTimeFormat("en-US", {
        weekday: "long"
      }).format(selectedDate);

      const days = Math.round(
        (selectedDate - today) / (1000 * 60 * 60 * 24)
      );

      if (days === 0) {
        difference.textContent = "Today";
      } else if (days === 1) {
        difference.textContent = "1 day from now";
      } else if (days > 1) {
        difference.textContent = `${days} days from now`;
      } else if (days === -1) {
        difference.textContent = "1 day ago";
      } else {
        difference.textContent = `${Math.abs(days)} days ago`;
      }

      weekday.classList.toggle("changed", days !== 0);
      date.classList.toggle("changed", days !== 0);
      difference.classList.toggle("changed", days !== 0);
    }

    function resetToToday() {
      selectedDate = new Date(today);
      updateDate();
    }

    function resetInactivityTimer() {
      clearTimeout(resetTimer);

      resetTimer = setTimeout(() => {
        resetToToday();
      }, 10000);
    }

    document.addEventListener("keydown", event => {
      resetInactivityTimer();

      switch (event.key) {
        case "ArrowLeft":
          selectedDate.setDate(selectedDate.getDate() - 1);
          break;

        case "ArrowRight":
          selectedDate.setDate(selectedDate.getDate() + 1);
          break;

        case "ArrowUp":
        case "PageUp":
          selectedDate.setMonth(selectedDate.getMonth() + 1);
          break;

        case "ArrowDown":
        case "PageDown":
          selectedDate.setMonth(selectedDate.getMonth() - 1);
          break;

        case "Backspace":
        case "Enter":
        case " ":
        case "Escape":
          resetToToday();
          event.preventDefault();
          return;

        default:
          return;
      }

      event.preventDefault();
      updateDate();
    });

    updateDate();
    resetInactivityTimer();
  </script>
</body>
</html>
